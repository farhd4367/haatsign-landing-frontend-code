# Local development stack for the HaatSign landing site (production-like).
#
# Builds the production image (Dockerfile: Next.js `next start`, non-root) and
# runs it on http://localhost:8080 - an origin the landing backend's CORS
# settings already allow.
#
# It reads content from the haatsign-landing-backend repository's local stack
# at http://localhost:8104. The site fetches that URL both in the browser and
# inside this container (ISR). Inside a container "localhost" is the container
# itself, so the small "landing-api" forwarder shares the web container's
# network and passes localhost:8104 on to the landing backend on this PC.
#
# Run from the repository root - see docker/local/README.md:
#   docker compose -f docker/local/docker-compose.yml up -d --build

name: haatsign-landing-frontend-local

services:
  web:
    image: haatsign-landing-frontend:local
    build:
      context: ../..
      dockerfile: Dockerfile
      # Fake, local-only values; API key/secret must match the landing
      # backend's docker/local/local.env (API_KEY, ENCRYPTION_SECRET).
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8104/api/landing
        NEXT_PUBLIC_API_URL: http://localhost:8104/api
        NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8104/api
        NEXT_PUBLIC_TEST_URL: http://localhost:8080
        NEXT_PUBLIC_API_KEY: local-dev-api-key
        NEXT_PUBLIC_SECRET_KEY: local-dev-encryption-secret
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: local-dev-recaptcha-site-key
    ports:
      - "127.0.0.1:8080:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Makes http://localhost:8104 inside the web container reach the landing
  # backend running on this PC (the browser already reaches it directly).
  landing-api:
    image: alpine/socat:1.8.0.3
    network_mode: "service:web"
    command: TCP-LISTEN:8104,fork,reuseaddr TCP:host.docker.internal:8104
    depends_on: [web]
    restart: unless-stopped
