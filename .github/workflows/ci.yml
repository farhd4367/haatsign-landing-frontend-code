name: CI

# Lints and builds the site on every push and pull request.
# (This project has no automated test suite yet; ESLint + a production build
# are the existing quality gates.)
# Pushes: once these checks pass, build the Docker image and push it to GHCR.
# Pull requests never build or push images. No server deployment.
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Dummy values only. getStaticProps falls back to empty data when the API
    # is unreachable, so the build never needs (or calls) the real backend.
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9/api/landing
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_ADMIN_API_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_TEST_URL: http://127.0.0.1:9
      NEXT_PUBLIC_API_KEY: ci-dummy-key
      NEXT_PUBLIC_SECRET_KEY: ci-dummy-secret
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-dummy-site-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  image:
    name: Build and push image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR image names must be lowercase.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/haatsign-landing-frontend" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Optional repository secrets (Settings > Secrets and variables > Actions).
          # Baked into the browser bundle at build time; unset ones build as empty.
          # The API URLs fall back to an unreachable address (as in the build job)
          # because the app otherwise defaults to the production API.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://127.0.0.1:9/api/landing' }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://127.0.0.1:9/api' }}
            NEXT_PUBLIC_ADMIN_API_URL=${{ secrets.NEXT_PUBLIC_ADMIN_API_URL || 'http://127.0.0.1:9/api' }}
            NEXT_PUBLIC_TEST_URL=${{ secrets.NEXT_PUBLIC_TEST_URL }}
            NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }}
            NEXT_PUBLIC_SECRET_KEY=${{ secrets.NEXT_PUBLIC_SECRET_KEY }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
